name: Claude Q&A

# Відповіді ревʼюера на питання в коментарях: напиши "@claude <питання>"
# під ревʼю або в рядку коду. Режим лише для читання: код не змінюється.

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

jobs:
  qa:
    if: >-
      contains(github.event.comment.body, '@claude') &&
      github.event.comment.user.login == github.repository_owner
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: write
      issues: write
      id-token: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          claude_args: |
            --model claude-sonnet-5-5
            --max-turns 10
            --append-system-prompt "Ти агент-ревʼюер навчального репозиторію go-developer-diary. Спочатку прочитай .github/review/REVIEWER.md і дотримуйся його стилю. Відповідай українською. Не пиши і не змінюй код у репозиторії: лише пояснюй, став навідні питання й давай посилання на джерела."
            --allowedTools "Read,Glob,Grep,Bash(gh pr view:*),Bash(gh pr diff:*),Bash(gh issue view:*)"
            --disallowedTools "Edit,MultiEdit,Write,NotebookEdit"
