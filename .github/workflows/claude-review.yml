name: Claude PR Review

# Автоматичне ревʼю кожного PR, виставленого в Ready for review.
# Інструкції ревʼюера лежать у .github/review/REVIEWER.md

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

# Новий push скасовує попереднє ревʼю того ж PR, щоб не палити токени
concurrency:
  group: claude-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    # Тільки не-чернетки, тільки PR із цього ж репозиторію (не з форків)
    # і тільки від власника репозиторію.
    if: >-
      github.event.pull_request.draft == false &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.user.login == github.repository_owner
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: write
      id-token: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1

      # Go потрібен, щоб ревʼюер міг запускати build/vet/test.
      # Пропускається, поки в репозиторії немає go.mod (перший PR).
      - name: Set up Go
        if: hashFiles('go.mod') != ''
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          use_sticky_comment: true
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}
            PR AUTHOR: ${{ github.event.pull_request.user.login }}
            BASE BRANCH: ${{ github.event.pull_request.base.ref }}

            Ти агент-ревʼюер навчального репозиторію go-developer-diary.
            Спочатку прочитай файл .github/review/REVIEWER.md і суворо
            дотримуйся його правил: формат вердикту, рівні серйозності,
            навчальний стиль ревʼю, мова відповіді (українська).

            Гілка PR уже в поточному каталозі. Деталі PR бери через
            `gh pr view` і `gh pr diff`.

            Загальний підсумок публікуй одним коментарем через
            `gh pr comment`. Конкретні зауваження до рядків коду
            публікуй через `mcp__github_inline_comment__create_inline_comment`
            з `confirmed: true`. Нічого, крім GitHub-коментарів, не публікуй.
            Код у репозиторії не змінюй і нічого не комітить.

          claude_args: |
            --model claude-sonnet-5-5
            --max-turns 15
            --allowedTools "Read,Glob,Grep,mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*),Bash(go build:*),Bash(go vet:*),Bash(go test:*),Bash(gofmt:*)"
